name: Scrape equipes L'Adresse

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 openpyxl

      - name: Lancer le scraper
        run: python scrape_ladresse.py

      - name: Sauvegarder le fichier dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ladresse_gerants.xlsx
          git diff --cached --quiet || git commit -m "Mise à jour des contacts L'Adresse"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: ladresse_gerants
          path: ladresse_gerants.xlsx
